[package]
name = "doc-viewer-desktop"
version = "0.0.0" # 실제 버전은 release.yml이 태그로 tauri.conf.json에 넣는다.
description = "윈도우에서 공용 웹 렌더러로 문서를 여는 셸"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 내용으로 형식 판별(detect.rs): ZIP 안 경로 목록·CFB 스트림 이름만 읽는다.
zip = { version = "2", default-features = false }
cfb = "0.15"
# 탐색기에서 지운 파일은 휴지통으로
trash = "5"
# 실제 경로를 Windows 전용 접두(\\?\) 없이 얻는다(경로 복사·explorer 인자에 그대로 쓴다)
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
